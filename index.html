<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Tetris</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #gameContainer {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        #canvas-container {
            position: relative;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        #gameCanvas {
            display: block;
            border-radius: 5px;
        }

        #ui-panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            padding: 20px;
            color: white;
            min-width: 200px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .ui-section {
            margin-bottom: 20px;
        }

        .ui-section h2 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .stat {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            font-size: 14px;
        }

        .stat-value {
            font-weight: bold;
            color: #ffd700;
        }

        #controls {
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 8px;
            font-size: 12px;
            line-height: 1.6;
        }

        #controls h3 {
            margin-bottom: 10px;
            color: #ffd700;
        }

        #controls div {
            margin: 5px 0;
        }

        #controls kbd {
            background: rgba(255, 255, 255, 0.2);
            padding: 2px 6px;
            border-radius: 3px;
            font-family: monospace;
            margin-right: 5px;
        }

        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            display: none;
            z-index: 1000;
        }

        #gameOver h1 {
            font-size: 48px;
            margin-bottom: 20px;
            color: #ff4444;
        }

        #gameOver p {
            font-size: 24px;
            margin: 10px 0;
        }

        #gameOver button {
            margin-top: 20px;
            padding: 15px 40px;
            font-size: 18px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        #gameOver button:hover {
            background: #764ba2;
        }

        #startScreen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            z-index: 1000;
        }

        #startScreen h1 {
            font-size: 48px;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #667eea, #764ba2, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        #startScreen button {
            margin-top: 20px;
            padding: 15px 40px;
            font-size: 18px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        #startScreen button:hover {
            background: #764ba2;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="canvas-container">
            <canvas id="gameCanvas"></canvas>
            <div id="startScreen">
                <h1>3D TETRIS</h1>
                <p>준비되셨나요?</p>
                <button onclick="startGame()">게임 시작</button>
            </div>
            <div id="gameOver">
                <h1>GAME OVER</h1>
                <p>최종 점수: <span id="finalScore">0</span></p>
                <button onclick="restartGame()">다시 시작</button>
            </div>
        </div>

        <div id="ui-panel">
            <div class="ui-section">
                <h2>게임 정보</h2>
                <div class="stat">
                    <span>점수:</span>
                    <span class="stat-value" id="score">0</span>
                </div>
                <div class="stat">
                    <span>레벨:</span>
                    <span class="stat-value" id="level">1</span>
                </div>
                <div class="stat">
                    <span>라인:</span>
                    <span class="stat-value" id="lines">0</span>
                </div>
            </div>

            <div id="controls">
                <h3>조작법</h3>
                <div><kbd>←</kbd><kbd>→</kbd> 좌우 이동</div>
                <div><kbd>↑</kbd><kbd>↓</kbd> 앞뒤 이동</div>
                <div><kbd>Q</kbd><kbd>E</kbd> X축 회전</div>
                <div><kbd>A</kbd><kbd>D</kbd> Y축 회전</div>
                <div><kbd>W</kbd><kbd>S</kbd> Z축 회전</div>
                <div><kbd>Space</kbd> 빠른 낙하</div>
                <div><kbd>P</kbd> 일시정지</div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
